<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Primeiro acesso')}"></head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm" style="max-width:420px;width:100%">
    <div class="card-body p-4">
      <h4 class="text-center mb-1">Primeiro acesso</h4>
      <p class="text-muted text-center">Crie o usuário administrador.</p>
      <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
      <form method="post" action="/setup">
        <div class="mb-3"><label class="form-label" for="username">Usuário</label>
          <input class="form-control" id="username" name="username" required minlength="3"></div>
        <div class="mb-3"><label class="form-label" for="senha">Senha (mín. 6)</label>
          <input class="form-control" id="senha" name="senha" type="password" required minlength="6"></div>
        <div class="mb-3"><label class="form-label" for="confirma">Confirmar senha</label>
          <input class="form-control" id="confirma" name="confirma" type="password" required></div>
        <button class="btn btn-success w-100">Criar administrador</button>
      </form>
    </div>
  </div>
</div>
</body>
</html>
