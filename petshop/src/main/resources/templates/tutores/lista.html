<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Tutores')}"></head>
<body>
<div class="d-flex flex-column flex-md-row min-vh-100">
  <nav th:replace="~{fragments :: menu('tutores')}"></nav>
  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">Tutores</h3><a class="btn btn-primary" href="/tutores/novo">+ Novo tutor</a>
    </div>
    <div th:replace="~{fragments :: msgs}"></div>
    <form class="input-group mb-3" method="get" action="/tutores">
      <input class="form-control" name="busca" placeholder="Buscar por nome" th:value="${busca}">
      <button class="btn btn-outline-secondary">Buscar</button>
    </form>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead><tr><th>Nome</th><th>Telefone</th><th>E-mail</th><th>CPF</th><th class="text-end">Ações</th></tr></thead>
        <tbody>
          <tr th:each="t : ${tutores}">
            <td th:text="${t.nome}"></td><td th:text="${t.telefoneFormatado()}"></td>
            <td th:text="${t.email}"></td><td th:text="${t.cpfMascarado()}"></td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/tutores/{id}/editar(id=${t.id})}">Editar</a>
              <form class="d-inline" method="post" th:action="@{/tutores/{id}/excluir(id=${t.id})}"
                    onsubmit="return confirm('Excluir este tutor? Esta ação não pode ser desfeita.')">
                <button class="btn btn-sm btn-outline-danger">Excluir</button>
              </form>
            </td>
          </tr>
          <tr th:if="${tutores.isEmpty()}"><td colspan="5" class="text-muted">Nenhum tutor encontrado.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div th:replace="~{fragments :: sessao}"></div>
</body>
</html>
