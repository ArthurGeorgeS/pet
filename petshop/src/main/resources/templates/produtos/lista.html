<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Produtos')}"></head>
<body>
<div class="d-flex flex-column flex-md-row min-vh-100">
  <nav th:replace="~{fragments :: menu('produtos')}"></nav>
  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">Produtos</h3><a class="btn btn-primary" href="/produtos/novo">+ Novo produto</a>
    </div>
    <div th:replace="~{fragments :: msgs}"></div>
    <form class="input-group mb-3" method="get" action="/produtos">
      <input class="form-control" name="busca" placeholder="Buscar por nome" th:value="${busca}">
      <button class="btn btn-outline-secondary">Buscar</button>
    </form>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead><tr><th>Nome</th><th>Preço</th><th>Estoque</th><th class="text-end">Ações</th></tr></thead>
        <tbody>
          <tr th:each="p : ${produtos}">
            <td th:text="${p.nome}"></td>
            <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
            <td><span th:text="${p.estoque}"></span> <span class="badge text-bg-warning" th:if="${p.estoque < 5}">baixo</span></td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/produtos/{id}/editar(id=${p.id})}">Editar</a>
              <form class="d-inline" method="post" th:action="@{/produtos/{id}/excluir(id=${p.id})}"
                    onsubmit="return confirm('Excluir este produto?')">
                <button class="btn btn-sm btn-outline-danger">Excluir</button>
              </form>
            </td>
          </tr>
          <tr th:if="${produtos.isEmpty()}"><td colspan="4" class="text-muted">Nenhum produto encontrado.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div th:replace="~{fragments :: sessao}"></div>
</body>
</html>
