<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo} + ' · PetShop'">PetShop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .menu { min-width: 230px; }
    .menu a { color: #cfd8dc; text-decoration: none; display: block; padding: .5rem .75rem; border-radius: .375rem; margin-bottom: .15rem; }
    .menu a:hover, .menu a.ativo { background: #0d6efd; color: #fff; }
    #bloqueio { position: fixed; inset: 0; background: rgba(0,0,0,.93); color: #fff; z-index: 3000;
                display: none; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>

<nav th:fragment="menu(ativo)" class="menu bg-dark text-white p-3">
  <h5 class="mb-3">🐾 PetShop</h5>
  <a href="/" th:classappend="${ativo == 'painel'} ? 'ativo'">📊 Painel</a>
  <a href="/tutores" th:classappend="${ativo == 'tutores'} ? 'ativo'">👤 Tutores</a>
  <a href="/pets" th:classappend="${ativo == 'pets'} ? 'ativo'">🐶 Pets</a>
  <a href="/agendamentos" th:classappend="${ativo == 'agendamentos'} ? 'ativo'">📅 Agendamentos</a>
  <a href="/produtos" th:classappend="${ativo == 'produtos'} ? 'ativo'">📦 Produtos</a>
  <hr class="border-secondary">
  <small class="d-block mb-2" th:text="'Usuário: ' + ${session.usuario}">Usuário</small>
  <a href="/logout">🚪 Sair</a>
</nav>

<div th:fragment="msgs">
  <div class="alert alert-success alert-dismissible fade show" th:if="${ok}">
    <span th:text="${ok}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}">
    <span th:text="${erro}"></span><button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
</div>

<div th:fragment="sessao">
  <div id="aviso-sessao" class="alert alert-warning position-fixed bottom-0 end-0 m-3 d-none shadow" style="z-index:2000">
    ⏳ Sessão expira em <strong id="aviso-seg">5</strong> s. Mexa o mouse ou digite para continuar.
  </div>
  <div id="bloqueio">
    <div><h2>🔒 Sessão expirada</h2><p>Você ficou 30 segundos sem atividade. Redirecionando para o login…</p></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/sessao.js"></script>
</div>
</body>
</html>
