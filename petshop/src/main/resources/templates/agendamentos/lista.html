<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Agendamentos')}"></head>
<body>
<div class="d-flex flex-column flex-md-row min-vh-100">
  <nav th:replace="~{fragments :: menu('agendamentos')}"></nav>
  <main class="flex-grow-1 p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0">Agendamentos</h3><a class="btn btn-primary" href="/agendamentos/novo">+ Novo agendamento</a>
    </div>
    <div th:replace="~{fragments :: msgs}"></div>
    <form class="input-group mb-3" method="get" action="/agendamentos">
      <input class="form-control" name="busca" placeholder="Buscar por nome do pet" th:value="${busca}">
      <button class="btn btn-outline-secondary">Buscar</button>
    </form>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead><tr><th>Data/hora</th><th>Pet</th><th>Serviço</th><th>Status</th><th class="text-end">Ações</th></tr></thead>
        <tbody>
          <tr th:each="a : ${agendamentos}">
            <td th:text="${#temporals.format(a.dataHora, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${a.pet.nome}"></td>
            <td th:text="${a.servico.replace('_',' ')}"></td>
            <td><span class="badge" th:text="${a.status.replace('_',' ')}"
                th:classappend="${a.status == 'CONCLUIDO'} ? 'text-bg-success' : (${a.status == 'CANCELADO'} ? 'text-bg-secondary' : (${a.status == 'EM_ANDAMENTO'} ? 'text-bg-warning' : 'text-bg-primary'))"></span></td>
            <td class="text-end text-nowrap">
              <a class="btn btn-sm btn-outline-primary" th:href="@{/agendamentos/{id}/editar(id=${a.id})}">Editar</a>
              <form class="d-inline" method="post" th:action="@{/agendamentos/{id}/excluir(id=${a.id})}"
                    onsubmit="return confirm('Excluir este agendamento?')">
                <button class="btn btn-sm btn-outline-danger">Excluir</button>
              </form>
            </td>
          </tr>
          <tr th:if="${agendamentos.isEmpty()}"><td colspan="5" class="text-muted">Nenhum agendamento encontrado.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>
<div th:replace="~{fragments :: sessao}"></div>
</body>
</html>
